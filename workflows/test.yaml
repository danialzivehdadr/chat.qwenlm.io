<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 CI Test Runner - bin/test.sh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            color: #1e3c72;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .file-badge {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 13px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .code-section, .explanation-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .section-title {
            color: #1e3c72;
            font-size: 20px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #1e3c72;
            display: flex;
            align-items: center;
        }
        
        .code-block {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.8;
            overflow-x: auto;
            position: relative;
        }
        
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .copy-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }
        
        .line-comment { color: #6a9955; }
        .line-command { color: #569cd6; }
        .line-string { color: #ce9178; }
        .line-variable { color: #9cdcfe; }
        .line-keyword { color: #c586c0; }
        
        .explanation-list {
            list-style: none;
        }
        
        .explanation-item {
            background: #f8f9fa;
            border-right: 4px solid #1e3c72;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .explanation-item:hover {
            transform: translateX(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .explanation-code {
            font-family: 'Courier New', monospace;
            color: #1e3c72;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }
        
        .explanation-text {
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .simulator-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .terminal {
            background: #0c0c0c;
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            min-height: 300px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
        }
        
        .terminal-line {
            margin-bottom: 5px;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .terminal-prompt { color: #00ff00; }
        .terminal-success { color: #00ff00; }
        .terminal-info { color: #00bfff; }
        .terminal-warning { color: #ffff00; }
        .terminal-error { color: #ff4444; }
        .terminal-dim { color: #888; }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }
        
        .btn-run {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
            color: white;
        }
        
        .btn-run:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
        }
        
        .btn-clear {
            background: #6c757d;
            color: white;
        }
        
        .btn-run:disabled, .btn-stop:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            display: block;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            width: 0%;
            transition: width 0.3s;
        }
        
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🧪 CI Test Runner</h1>
            <p>Interactive visualization of the project's test execution script</p>
            <div class="file-badge">📄 bin/test.sh</div>
        </div>
        
        <!-- Code + Explanation Grid -->
        <div class="main-grid">
            <!-- Code Display -->
            <div class="code-section">
                <h2 class="section-title">📝 Source Code</h2>
                <div class="code-block" id="codeBlock">
                    <button class="copy-btn" onclick="copyCode()">📋 Copy</button>
<span class="line-comment">#!/usr/bin/env bash</span>
<span class="line-comment"># This script is used to run all the main project tests that run on CI via .github/workflows/test.yaml.</span>
<span class="line-comment"># Usage:</span>
<span class="line-comment">#   $ ./bin/test.sh</span>

<span class="line-variable">SCRIPT_DIR</span>=<span class="line-string">"</span><span class="line-command">$(</span> <span class="line-command">cd</span> <span class="line-string">"</span><span class="line-command">$(</span> <span class="line-command">dirname</span> <span class="line-string">"</span><span class="line-variable">${BASH_SOURCE[0]}</span><span class="line-string">"</span> <span class="line-command">)</span><span class="line-string">"</span> &gt;/dev/null 2&gt;&amp;1 &amp;&amp; <span class="line-command">pwd</span> <span class="line-command">)</span><span class="line-string">"</span>
<span class="line-keyword">cd</span> <span class="line-string">"</span><span class="line-variable">$SCRIPT_DIR</span>/..<span class="line-string">"</span> || <span class="line-keyword">exit</span> 1

<span class="line-keyword">exec</span> <span class="line-command">uv</span> run pytest <span class="line-variable">--numprocesses</span> auto tests/ci <span class="line-variable">$1</span> <span class="line-variable">$2</span> <span class="line-variable">$3</span>
                </div>
            </div>
            
            <!-- Explanation -->
            <div class="explanation-section">
                <h2 class="section-title">📖 Line-by-Line Explanation</h2>
                <ul class="explanation-list">
                    <li class="explanation-item">
                        <div class="explanation-code">#!/usr/bin/env bash</div>
                        <div class="explanation-text">Shebang line - tells the system to use bash interpreter</div>
                    </li>
                    <li class="explanation-item">
                        <div class="explanation-code"># Comments (lines 2-4)</div>
                        <div class="explanation-text">Documentation explaining the script's purpose and usage</div>
                    </li>
                    <li class="explanation-item">
                        <div class="explanation-code">SCRIPT_DIR="$( cd ... )"</div>
                        <div class="explanation-text">Captures the absolute path of the script's directory, resolving symlinks</div>
                    </li>
                    <li class="explanation-item">
                        <div class="explanation-code">cd "$SCRIPT_DIR/.." || exit 1</div>
                        <div class="explanation-text">Changes to project root (parent of bin/). Exits with error code 1 if it fails</div>
                    </li>
                    <li class="explanation-item">
                        <div class="explanation-code">exec uv run pytest ...</div>
                        <div class="explanation-text">Executes pytest via uv with parallel processing. Passes up to 3 additional arguments ($1, $2, $3)</div>
                    </li>
                </ul>
            </div>
        </div>
        
        <!-- Simulator -->
        <div class="simulator-section">
            <h2 class="section-title">▶️ Live Test Execution Simulator</h2>
            
            <div class="controls">
                <button class="control-btn btn-run" id="runBtn" onclick="runTests()">▶️ Run Tests</button>
                <button class="control-btn btn-stop" id="stopBtn" onclick="stopTests()" disabled>⏹️ Stop</button>
                <button class="control-btn btn-clear" onclick="clearTerminal()">🗑️ Clear</button>
            </div>
            
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div class="terminal" id="terminal">
                <div class="terminal-line terminal-dim">$ Waiting for execution...</div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-number" id="totalTests">0</span>
                    <span class="stat-label">Total Tests</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="passedTests">0</span>
                    <span class="stat-label">Passed</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="failedTests">0</span>
                    <span class="stat-label">Failed</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="duration">0s</span>
                    <span class="stat-label">Duration</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // Code Copy Function
        // ============================================
        function copyCode() {
            const code = `#!/usr/bin/env bash
# This script is used to run all the main project tests that run on CI via .github/workflows/test.yaml.
# Usage:
#   $ ./bin/test.sh

SCRIPT_DIR="$( cd "$( dirname "\${BASH_SOURCE[0]}" )" >/dev/null 2>&1 && pwd )"
cd "$SCRIPT_DIR/.." || exit 1

exec uv run pytest --numprocesses auto tests/ci $1 $2 $3`;
            
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = '✅ Copied!';
                setTimeout(() => btn.textContent = '📋 Copy', 2000);
            });
        }
        
        // ============================================
        // Test Simulator
        // ============================================
        let isRunning = false;
        let testInterval = null;
        let currentTest = 0;
        let startTime = 0;
        
        const testFiles = [
            'tests/ci/test_auth.py',
            'tests/ci/test_api.py',
            'tests/ci/test_database.py',
            'tests/ci/test_models.py',
            'tests/ci/test_views.py',
            'tests/ci/test_utils.py',
            'tests/ci/test_middleware.py',
            'tests/ci/test_permissions.py',
            'tests/ci/test_serializers.py',
            'tests/ci/test_validators.py'
        ];
        
        function addTerminalLine(text, className = '') {
            const terminal = document.getElementById('terminal');
            const line = document.createElement('div');
            line.className = `terminal-line ${className}`;
            line.textContent = text;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }
        
        function runTests() {
            if (isRunning) return;
            isRunning = true;
            currentTest = 0;
            startTime = Date.now();
            
            document.getElementById('runBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('progressBar').style.display = 'block';
            
            // Clear previous stats
            document.getElementById('totalTests').textContent = '0';
            document.getElementById('passedTests').textContent = '0';
            document.getElementById('failedTests').textContent = '0';
            document.getElementById('duration').textContent = '0s';
            
            const terminal = document.getElementById('terminal');
            terminal.innerHTML = '';
            
            // Initial output
            addTerminalLine('$ uv run pytest --numprocesses auto tests/ci', 'terminal-prompt');
            addTerminalLine('');
            addTerminalLine('========================================', 'terminal-dim');
            addTerminalLine('  CI Test Suite - Parallel Execution', 'terminal-info');
            addTerminalLine('========================================', 'terminal-dim');
            addTerminalLine('');
            addTerminalLine('🔧 Setting up test environment...', 'terminal-info');
            
            setTimeout(() => {
                addTerminalLine('✓ Environment ready', 'terminal-success');
                addTerminalLine('📦 Loading test modules...', 'terminal-info');
                addTerminalLine('');
                
                // Start test execution
                testInterval = setInterval(executeNextTest, 800);
            }, 1000);
        }
        
        function executeNextTest() {
            if (!isRunning || currentTest >= testFiles.length) {
                finishTests();
                return;
            }
            
            const testFile = testFiles[currentTest];
            const testCount = Math.floor(Math.random() * 15) + 5;
            const failedCount = Math.random() > 0.9 ? Math.floor(Math.random() * 2) : 0;
            const passedCount = testCount - failedCount;
            
            addTerminalLine(`📄 Running: ${testFile}`, 'terminal-info');
            
            setTimeout(() => {
                if (failedCount > 0) {
                    addTerminalLine(`   ⚠️  ${failedCount} failed, ${passedCount} passed`, 'terminal-warning');
                } else {
                    addTerminalLine(`   ✓ ${passedCount} passed`, 'terminal-success');
                }
                
                // Update stats
                const totalEl = document.getElementById('totalTests');
                const passedEl = document.getElementById('passedTests');
                const failedEl = document.getElementById('failedTests');
                
                totalEl.textContent = parseInt(totalEl.textContent) + testCount;
                passedEl.textContent = parseInt(passedEl.textContent) + passedCount;
                failedEl.textContent = parseInt(failedEl.textContent) + failedCount;
                
                // Update progress
                const progress = ((currentTest + 1) / testFiles.length) * 100;
                document.getElementById('progressFill').style.width = progress + '%';
                
                // Update duration
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                document.getElementById('duration').textContent = elapsed + 's';
                
                currentTest++;
            }, 400);
        }
        
        function finishTests() {
            clearInterval(testInterval);
            isRunning = false;
            
            document.getElementById('runBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            
            const total = parseInt(document.getElementById('totalTests').textContent);
            const passed = parseInt(document.getElementById('passedTests').textContent);
            const failed = parseInt(document.getElementById('failedTests').textContent);
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
            
            addTerminalLine('');
            addTerminalLine('========================================', 'terminal-dim');
            
            if (failed === 0) {
                addTerminalLine(`✅ ALL TESTS PASSED (${passed}/${total})`, 'terminal-success');
                addTerminalLine(`⏱️  Duration: ${elapsed}s`, 'terminal-info');
            } else {
                addTerminalLine(`⚠️  ${failed} FAILED, ${passed} PASSED (out of ${total})`, 'terminal-warning');
                addTerminalLine(`⏱️  Duration: ${elapsed}s`, 'terminal-info');
            }
            
            addTerminalLine('========================================', 'terminal-dim');
            addTerminalLine('');
            addTerminalLine('$ _', 'terminal-prompt
